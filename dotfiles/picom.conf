backend = "xrender";
vsync = true;

use-ewmh-active-win = true;

# Shadow and fading
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
shadow-opacity = 0.8;
shadow-radius = @SHADOW_RADIUS@;
shadow-offset-x = -@SHADOW_OFFSET@;
shadow-offset-y = -@SHADOW_OFFSET@;
# crop-shadow-to-monitor = true;

# Window rules (last match wins)
rules = (
  # Opacity
  # Cannot use override-redirect:
  #  https://github.com/yshui/picom/issues/625
  { match = "!(focused || override_redirect)"; opacity = 0.85; },
  { match = "window_type = 'combo' || window_type *= 'menu'"; opacity = 0.95; },
  { match = "_GTK_FRAME_EXTENTS@"
         " || fullscreen"
         " || class_i = 'jitsi meet'"
         " || class_g = 'Rofi'"
         " || class_g = 'mpv'"
         " || class_g = 'Xss-dimmer'"
         " || class_g = 'scummvm'"
         " || window_type = 'dock'"
         " || window_type = 'utility'";
    opacity = 1; },
  { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_HIDDEN'"; opacity = 0; },

  # Shadow
  { match = "window_type = 'normal'"
         " || window_type = 'dock'"
         " || window_type = 'notification'"
         " || window_type = 'splash'"
         " || window_type = 'dialog'";
    shadow = true; },
  { match = "window_type = 'dock'"; clip-shadow-above = true; },
  { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_HIDDEN'"
         # GTK frame extents are used for client-side shadows, we shouldn't have that.
         " || _GTK_FRAME_EXTENTS@"
         " || class_i = 'xss-dimmer'"
         " || class_i = 'i3-frame'"
         " || class_g = 'Rofi'"
         # Other sharing indicators
         " || name ~= 'is sharing your screen.$'" # Chrome
         " || name = 'Firefox — Sharing Indicator'" # Firefox
         " || name = 'Screen Sharing Tracker'"; # Jitsi
    shadow = false; },

  # Fading
  { fade = false; },
  { match = "window_type = 'combo'"
         " || window_type *= 'menu'"
         " || window_type = 'tooltip'"
         " || window_type = 'notification'"
         " || window_type = 'splash'"
         " || window_type = 'dialog'";
    fade = true; },

  # Animations
  { match = "class_g = 'Dunst'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "fly-in"; direction = "up"; duration = 0.2;
        suppressions = [ "increase-opacity", "decrease-opacity" ]; },
      { triggers = [ "close", "hide" ]; preset = "fly-out"; direction = "up"; duration = 0.2; }
    ); }
);
